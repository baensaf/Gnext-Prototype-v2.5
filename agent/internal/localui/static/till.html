<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>صندوق آفلاین جی‌نکست</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="till.css">
</head>
<body class="till">
  <header class="top">
    <div class="brand">
      <img class="logo" src="favicon.svg" alt="">
      <div>
        <h1>صندوق آفلاین</h1>
        <p id="where" class="muted">در حال بارگذاری…</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="mode" class="badge">…</span>
      <span id="who" class="muted"></span>
      <button id="lock" class="btn" hidden>قفل صندوق</button>
    </div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <!-- Who is at the till: a name, then a PIN. -->
  <section id="signin" class="signin" hidden>
    <h2>کاربر را انتخاب کنید</h2>
    <div id="staff" class="staff"></div>
    <form id="pin-form" class="pin" hidden>
      <p id="pin-name" class="pin-name"></p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" class="ltr" aria-label="پین">
      <div class="keys">
        <button type="button" data-key="1">۱</button><button type="button" data-key="2">۲</button><button type="button" data-key="3">۳</button>
        <button type="button" data-key="4">۴</button><button type="button" data-key="5">۵</button><button type="button" data-key="6">۶</button>
        <button type="button" data-key="7">۷</button><button type="button" data-key="8">۸</button><button type="button" data-key="9">۹</button>
        <button type="button" data-key="back">⌫</button><button type="button" data-key="0">۰</button><button type="submit" class="primary">ورود</button>
      </div>
      <button type="button" id="pin-cancel" class="btn ghost">کاربر دیگر</button>
    </form>
  </section>

  <!-- Selling: categories, products, the order. -->
  <section id="sell" class="sell" hidden>
    <nav id="categories" class="categories"></nav>
    <div class="products-wrap">
      <input id="search" type="search" placeholder="جستجوی کالا…" aria-label="جستجو">
      <div id="products" class="products"></div>
    </div>
    <aside class="order">
      <div class="order-type" role="radiogroup">
        <button type="button" data-type="TAKEAWAY" class="on">بیرون‌بر</button>
        <button type="button" data-type="DINE_IN">سالن</button>
      </div>
      <div id="dine-in" class="dine-in" hidden>
        <label>میز<select id="table"></select></label>
        <label>تعداد نفرات<input id="guests" type="number" min="1" max="99" class="ltr"></label>
      </div>
      <ol id="lines" class="lines"></ol>
      <p id="empty" class="muted empty">سفارش خالی است. از منو کالا را انتخاب کنید.</p>
      <dl class="totals">
        <dt>جمع</dt><dd id="subtotal">۰</dd>
        <dt>مالیات</dt><dd id="tax">۰</dd>
        <dt class="grand">مبلغ کل</dt><dd id="grand" class="grand">۰</dd>
      </dl>
      <div class="order-actions">
        <button class="btn" id="clear" disabled>پاک کردن</button>
        <button class="btn" id="send" disabled title="ثبت سفارش در مرحلهٔ بعد اضافه می‌شود">ارسال به آشپزخانه</button>
        <button class="btn primary" id="pay" disabled title="پرداخت در مرحلهٔ بعد اضافه می‌شود">پرداخت</button>
      </div>
      <p class="muted small">ثبت، ارسال به آشپزخانه و پرداخت در مرحلهٔ بعد فعال می‌شوند.</p>
    </aside>
  </section>

  <dialog id="dlg-product">
    <form method="dialog" id="product-form">
      <h2 id="p-name"></h2>
      <div id="p-variants" class="choices"></div>
      <div id="p-groups"></div>
      <div class="row qty-row">
        <span class="muted">تعداد</span>
        <div class="stepper">
          <button type="button" id="p-minus">−</button>
          <output id="p-qty">۱</output>
          <button type="button" id="p-plus">+</button>
        </div>
      </div>
      <label>توضیح<input id="p-notes" maxlength="200" placeholder="مثلاً بدون پیاز"></label>
      <p id="p-error" class="error-text" hidden></p>
      <div class="actions">
        <button class="btn ghost" value="cancel" formnovalidate>انصراف</button>
        <button class="btn primary" value="ok" id="p-add">افزودن <span id="p-price"></span></button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" hidden></div>
  <script src="till.js"></script>
</body>
</html>
