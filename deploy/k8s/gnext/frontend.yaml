# nginx with the built SPA. Its nginx.conf still does the API, SSE, WebSocket and upload
# routing to http://backend:3100, which resolves to the backend Service in this namespace.
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: gnext-frontend
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          # The static page, not /health/ready: the frontend is ready even while the backend migrates.
          readinessProbe:
            httpGet: { path: /index.html, port: 80 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 128Mi }
