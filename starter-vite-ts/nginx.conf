server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Handle React SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ^~ on every proxied prefix: without it the static-asset regex below wins for any path
    # ending in .png/.jpg, and uploaded photos (/api/v1/media/uploads/<name>.png) 404 here.

    # Agent builds are uploaded here.
    location ^~ /api/v1/agent-releases {
        client_max_body_size 64m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_pass http://backend:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live change stream (Server-Sent Events): long-lived, and every event must go out at
    # once rather than wait in nginx's buffer. The backend sends a heartbeat every 20 s.
    location ^~ /api/v1/live/ {
        proxy_pass http://backend:3100;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy API requests to backend NestJS container. Photos are up to 5 MB
    # (MediaService), so the body limit sits just above nginx's 1 MB default.
    location ^~ /api/ {
        client_max_body_size 6m;
        proxy_pass http://backend:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public readiness endpoint for Docker and the CDN origin health check.
    location ^~ /health/ {
        proxy_pass http://backend:3100/health/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy uploads
    location ^~ /uploads/ {
        proxy_pass http://backend:3100/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}

