name: CI/CD

# Every push runs the checks. A push to main that passes them deploys to the VPS.
# To redeploy or roll back: Actions > CI/CD > Run workflow on main, optionally with a commit sha.
on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      ref:
        description: Commit sha to deploy (empty = latest main)
        required: false

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DEPLOY_HOST: 195.234.80.33
  DEPLOY_PORT: '20481'
  DEPLOY_USER: baensaf
  DEPLOY_KNOWN_HOST: '[195.234.80.33]:20481 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK+Zrt2kVT+8saVUy3+QcJE5pcza3Vo5YV1Un3fCSZaK'
  AGENT_RELEASE_URL: https://gnextdev.ir

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: appdb
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      # Several suites call runMigrations() in parallel; on an empty database they race.
      - run: npm run migration:run
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter-vite-ts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: starter-vite-ts/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build

  # The Go branch agent (agent/). Tests run on Linux; the shipped binary is built for Windows.
  agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      # The offline till screen is the web POS's register, built from starter-vite-ts into
      # internal/localui/tillui, which the agent embeds and serves at /till/.
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: starter-vite-ts/package-lock.json
      - name: Build the offline till screen
        working-directory: starter-vite-ts
        run: |
          npm ci --legacy-peer-deps
          npm run build:till
          test -f ../agent/internal/localui/tillui/index.html
      - run: go vet ./...
      - run: GOOS=windows go vet ./...
      - run: go test -race ./...
      - name: Build gnext-agent.exe
        run: |
          version=$(cat VERSION)
          # Icon, version details and manifest (cmd/gnext-agent/winres), linked in as a .syso.
          (cd cmd/gnext-agent && go run github.com/tc-hib/go-winres@v0.3.3 make --arch amd64 --product-version=$version --file-version=$version)
          # A windowed program: no console for the service, tray or settings window.
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags "-s -w -H windowsgui -X main.version=$version" -o dist/gnext-agent.exe ./cmd/gnext-agent
          sha256sum dist/gnext-agent.exe
      - uses: actions/upload-artifact@v4
        with:
          name: gnext-agent-exe
          path: agent/dist/gnext-agent.exe

  # Wraps the agent in a setup wizard (Inno Setup). The artifact holds the installer for branch
  # PCs, and the bare .exe and the zipped Saman bridge (agent-release offers those to the cloud
  # after deploy, for agents to update to).
  agent-installer:
    needs: agent
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: gnext-agent-exe
          path: agent/dist
      - name: Build the Saman bridge
        shell: pwsh
        run: |
          dotnet build saman-bridge\SamanBridge.csproj -c Release -o dist\saman --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item dist\saman\*.pdb -ErrorAction SilentlyContinue
          '{"op":"version"}' | & dist\saman\gnext-saman-bridge.exe
          # What agents on this version install into saman\ (agent-protocol §9.3).
          Compress-Archive -Path dist\saman\* -DestinationPath dist\gnext-saman-bridge.zip
          Get-Item dist\gnext-saman-bridge.zip | Format-Table Name, Length
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = (Get-Content VERSION -Raw).Trim()
          & $iscc /Q "/DAppVersion=$version" "/DSourceExe=..\dist\gnext-agent.exe" "/DSamanDir=..\dist\saman" installer\gnext-agent.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist -File -Recurse | Get-FileHash -Algorithm SHA256 | Format-Table -AutoSize
      - uses: actions/upload-artifact@v4
        with:
          name: gnext-agent-windows
          path: agent/dist/

  # Branches only: proves GitHub can reach the VPS with the deploy key, without deploying.
  deploy-check:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::Add the VPS_SSH_KEY repository secret"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > ~/.ssh/known_hosts
      - name: Ping the VPS
        run: ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o ConnectTimeout=20 "$DEPLOY_USER@$DEPLOY_HOST" ping

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [backend, frontend, agent-installer]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          [ -n "$DEPLOY_KEY" ] || { echo "::error::Add the VPS_SSH_KEY repository secret"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOST" > ~/.ssh/known_hosts
      - name: Deploy
        run: |
          sha=$(git rev-parse HEAD)
          git archive --format=tar.gz "$sha" \
            | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o ConnectTimeout=20 -o ServerAliveInterval=30 \
                "$DEPLOY_USER@$DEPLOY_HOST" "deploy $sha"

  # Offers the agent this run built to the cloud, unpublished; head office publishes it on the
  # Branch Agents screen. Only a new agent/VERSION makes a new release; the same version again
  # is a no-op. Runs after deploy because the backend that takes the upload is the one deployed.
  agent-release:
    if: github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    concurrency:
      group: agent-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: agent/VERSION
          sparse-checkout-cone-mode: false
      # Holds the bare exe and the bridge zip (what agents update to) and the setup wizard (what
      # head office downloads).
      - uses: actions/download-artifact@v4
        with:
          name: gnext-agent-windows
          path: dist
      - name: Upload to the cloud
        env:
          TOKEN: ${{ secrets.AGENT_RELEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::AGENT_RELEASE_TOKEN is not set; the agent build was not uploaded. See docs/agent-gateway/HANDOFF.md."
            exit 0
          fi
          version=$(tr -d '[:space:]' < agent/VERSION)
          setup="dist/gnext-agent-setup-$version.exe"
          bridge="dist/gnext-saman-bridge.zip"
          for f in "$setup" "$bridge"; do
            [ -f "$f" ] || { echo "::error::$f is missing from the gnext-agent-windows artifact"; exit 1; }
          done
          sha256sum dist/gnext-agent.exe "$setup" "$bridge"
          sha=$(sha256sum dist/gnext-agent.exe | cut -d' ' -f1)
          # The link from GitHub to the VPS carries about 20 KB/s, so ask before sending megabytes.
          held=$(curl -sS --max-time 60 --retry 3 --retry-all-errors -H "Authorization: Bearer $TOKEN" \
            "$AGENT_RELEASE_URL/api/v1/agent-releases/ci/$version") || held='{}'
          echo "Cloud holds: $held"
          if [ "$(jq -r .exists <<<"$held")" = "true" ]; then
            if [ "$(jq -r .sha256 <<<"$held")" != "$sha" ]; then
              echo "::warning::Agent $version is already uploaded with a different build. Bump agent/VERSION to ship agent changes."
              exit 0
            fi
            if [ "$(jq -r .has_installer <<<"$held")" = "true" ] && [ "$(jq -r .has_bridge <<<"$held")" = "true" ]; then
              echo "Agent $version, its installer and its bridge are already uploaded; nothing to do."
              exit 0
            fi
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 1800 --retry 1 --retry-all-errors \
            -H "Authorization: Bearer $TOKEN" \
            -F "version=$version" -F "commit=$(git rev-parse HEAD)" \
            -F "file=@dist/gnext-agent.exe;type=application/octet-stream" \
            -F "installer=@$setup;type=application/octet-stream" \
            -F "bridge=@$bridge;type=application/zip" \
            "$AGENT_RELEASE_URL/api/v1/agent-releases/ci") || code=000
          cat response.json 2>/dev/null; echo
          [ "$code" = "200" ] || { echo "::error::Upload of agent $version failed: HTTP $code"; exit 1; }
          if [ "$(jq -r .created response.json)" = "true" ]; then
            echo "::notice::Agent $version uploaded. Publish it on the Branch Agents screen to roll it out."
          elif [ "$(jq -r .sha256_matches response.json)" = "true" ]; then
            echo "Agent $version was already uploaded; installer attached: $(jq -r .installer_attached response.json), bridge attached: $(jq -r .bridge_attached response.json)."
          else
            echo "::warning::Agent $version is already uploaded with a different build. Bump agent/VERSION to ship agent changes."
          fi
