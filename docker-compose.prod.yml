# Fixed project name: the volumes below are gnext-v2_*, whichever folder this runs from.
name: gnext-v2

services:
  postgres:
    image: postgres:16-alpine
    container_name: gnext_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gnext}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment .env file}
      POSTGRES_DB: ${DB_NAME:-appdb}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"'
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gnext_backend
    restart: unless-stopped
    expose:
      - "3100"
    environment:
      NODE_ENV: production
      PORT: 3100
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-gnext}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the deployment .env file}
      DB_NAME: ${DB_NAME:-appdb}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin@gnext.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the deployment .env file}
      APPROVER_DEMO_PIN: ${APPROVER_DEMO_PIN:-2468}
      # Public base URL agents are told to connect to, e.g. https://app.example.ir.
      AGENT_PUBLIC_URL: ${AGENT_PUBLIC_URL:-}
      # Shared with the AGENT_RELEASE_TOKEN repository secret; lets CI add unpublished agent builds.
      AGENT_RELEASE_CI_TOKEN: ${AGENT_RELEASE_CI_TOKEN:-}
      SEED_PROFILE: minimal
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/uploads
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./starter-vite-ts
      dockerfile: Dockerfile
    container_name: gnext_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1/health/ready || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  backend_uploads:
  backend_data:
